# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "wireguide"
arch: ${GOARCH}
platform: "linux"
version: "0.5.2"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Cross-platform WireGuard VPN desktop client"
vendor: "korjwl1"
homepage: "https://github.com/korjwl1/wireguide"
license: "MIT"
release: "1"

contents:
  - src: "./bin/wireguide"
    dst: "/usr/local/bin/wireguide"
  # Full hicolor set (scalable SVG, sized PNGs, symbolic), pre-rendered by
  # build/icon/render.sh. The previous single entry installed the 1024px
  # master under 128x128, which icon loaders either rescale badly or skip.
  # Listed file by file rather than as a tree so the package owns only its
  # own icons, not the shared hicolor directories.
  - src: "./build/linux/icons/hicolor/scalable/apps/wireguide.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/wireguide.svg"
  - src: "./build/linux/icons/hicolor/symbolic/apps/wireguide-symbolic.svg"
    dst: "/usr/share/icons/hicolor/symbolic/apps/wireguide-symbolic.svg"
  - src: "./build/linux/icons/hicolor/16x16/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/24x24/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/32x32/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/48x48/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/64x64/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/128x128/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/256x256/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/wireguide.png"
  - src: "./build/linux/icons/hicolor/512x512/apps/wireguide.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/wireguide.png"
  - src: "./build/linux/wireguide.desktop"
    dst: "/usr/share/applications/wireguide.desktop"
  # AppStream metadata: name, summary and description in GNOME Software /
  # KDE Discover instead of a bare package name.
  - src: "./build/linux/io.github.korjwl1.wireguide.metainfo.xml"
    dst: "/usr/share/metainfo/io.github.korjwl1.wireguide.metainfo.xml"
  # Branded authentication prompt for the helper (see the file's header).
  - src: "./build/linux/io.github.korjwl1.wireguide.policy"
    dst: "/usr/share/polkit-1/actions/io.github.korjwl1.wireguide.policy"

# Wails v3 alpha.74 uses GTK3 and the WebKitGTK 4.1 API on Linux.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - libayatana-appindicator3-1
  - iproute2
  - nftables
  - pkexec | policykit-1

# NetworkManager supplies SSID detection and immediate Wi-Fi change events,
# while resolvconf avoids the guarded /etc/resolv.conf fallback on systems
# that do not run systemd-resolved. Noto supplies Korean UI glyphs and stable
# cross-platform text metrics. The core client can still operate without these,
# so keep them as recommendations rather than hard dependencies.
recommends:
  - network-manager
  - resolvconf
  - fonts-noto-core
  - fonts-noto-cjk

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM package names used by current Fedora/RHEL-family distributions.
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libayatana-appindicator-gtk3
      - polkit
      - iproute
      - nftables
    # The top-level recommends use Debian package names, which resolve to
    # nothing on Fedora/RHEL.
    recommends:
      - NetworkManager
      - google-noto-sans-fonts
      - google-noto-sans-cjk-fonts
    # GNOME Shell has no tray of its own; this extension provides one.
    # WireGuide works without it (closing the window then minimises
    # instead of hiding), so it is only a suggestion.
    suggests:
      - gnome-shell-extension-appindicator

  # Arch Linux package names.
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - libayatana-appindicator
      - polkit
      - iproute2
      - nftables

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

