<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="56 56 912 912">
  <!--
    WireGuide app icon — master artwork.

    Pure vector: a red rounded tile with a heavy italic W. Earlier
    revisions embedded the 64px tray bitmap and smooth-scaled it to 560px,
    which left visibly stair-stepped edges at every size above ~96px
    (GNOME's app grid and Alt-Tab both render larger than that). Drawing
    the glyph as a path keeps it sharp from 16px to 1024px.

    Every raster and per-platform derivative is generated from this file
    by build/icon/render.sh — edit here, then re-run the script.

    Canvas is 1024 with the tile inset 92px (the macOS icon grid). The
    Linux hicolor variant crops the viewBox tighter so the tile fills the
    slot the way other GNOME app icons do.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D63E43"/>
      <stop offset="0.5" stop-color="#A91E23"/>
      <stop offset="1" stop-color="#6F1216"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6E9E9"/>
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="92" y="92" width="840" height="840" rx="200" fill="url(#tile)"/>
  <rect x="92" y="92" width="840" height="840" rx="200" fill="url(#gloss)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" fill="none"
        stroke="url(#rim)" stroke-width="8"/>

  <!-- W glyph: 600×380 upright outline, scaled, sheared 10° about its centre and
       centred on the tile. The same-colour round-joined stroke softens the
       corners without changing the letterform. -->
  <g filter="url(#glyphShadow)">
    <path transform="translate(512 512) scale(0.92) skewX(-10) translate(-300 -190)"
          d="M0 0H115L175 235L245 0H355L425 235L485 0H600L480 380H370L300 150L230 380H120Z"
          fill="url(#glyph)" stroke="url(#glyph)" stroke-width="18"
          stroke-linejoin="round"/>
  </g>
</svg>
